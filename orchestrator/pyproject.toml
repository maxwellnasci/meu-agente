[project]
name = "orchestrator"
version = "0.1.0"
description = "Orquestrador LangGraph (cerebro) que delega tarefas de programacao ao OpenClaw (especialista) via API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "tenacity>=9.0",
    # Pisos de seguranca para dependencias TRANSITIVAS com CVE conhecido
    # (pip-audit, 2026-11-02): sem eles o resolvedor pode instalar versoes
    # vulneraveis. certifi: PYSEC-2026-4320 | urllib3: PYSEC-2026-4175/6/7 |
    # langgraph-sdk: PYSEC-2026-4240, CVE-2026-118667.
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
    "langgraph-sdk>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Usado como BIBLIOTECA pelo tests/conftest.py para bloquear rede no nivel
    # de socket na suite inteira; o plugin dele fica desligado em addopts.
    # Faixa travada: hermetic_support.loopback_socket usa a API privada
    # `_true_socket` e o bloqueio de getaddrinfo, verificados na 0.8.1.
    "pytest-socket>=0.8.1,<0.9",
    "ruff>=0.7",
]
# Ferramentas de analise de seguranca usadas no CI (.github/workflows/ci.yml).
security = [
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
# -p no:socket: o teardown do plugin pytest-socket RELIGA a rede depois de cada
# teste (e deixa coleta/fixtures de sessao abertas); o conftest faz o bloqueio
# sozinho, para o processo inteiro. -p no:langsmith_plugin: o plugin do
# LangSmith importa o SDK antes do conftest limpar o ambiente.
addopts = "-p no:socket -p no:langsmith_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

  resposta: "O frango congelado marcando -10°C pode ser aceito, pois está dentro da faixa permitida para\
    \ congelados, que é de até -12°C (POP-01, seção \"4. Temperatura na chegada\"). \n\nPorém, é importante\
    \ verificar também:\n1. Se não há sinais de descongelamento (gelo acumulado, embalagem molhada ou\
    \ produto amolecido), pois nesses casos o produto deve ser recusado independentemente da temperatura;\n\
    2. Se foram feitas as 3 medições (início, meio e fim do caminhão) e todas anotadas no registro F-07.\n\
    \nDepois do recebimento, o frango deve ser armazenado em câmara a -18°C ou menos (POP-05, seção \"\
    4. Temperatura de armazenamento e exposição\") e transferido para a câmara em no máximo 30 minutos\
    \ após a conferência (POP-01, seção \"7. Prazo para guardar\")."
  classe: ACEITA

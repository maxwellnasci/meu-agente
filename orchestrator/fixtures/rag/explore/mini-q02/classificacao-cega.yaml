itens:
- codigo: r01
  pergunta_id: q04
  pergunta: cliente quer trocar um queijo que comprou anteontem, posso trocar?
  resposta: "Para a troca do queijo comprado anteontem, as regras são as seguintes:\n\n1. Se o queijo\
    \ estava **vencido na data da compra**:\n   - Troca ou reembolso imediato em qualquer prazo\n   -\
    \ O cliente recebe também um vale-compras de R$ 20,00\n   - (POP-03, seção \"Produto vencido vendido\
    \ pela loja\")\n\n2. Se o queijo está **dentro da validade**:\n   - Prazo de 24 horas a partir da\
    \ compra para troca (como foi comprado anteontem, já passou o prazo)\n   - Exceto se houver defeito\
    \ de qualidade (cheiro, cor, mofo) - nesse caso ainda pode trocar em até 24 horas\n   - (POP-03, seção\
    \ \"Prazo de troca — produtos perecíveis\")\n\n3. Se o queijo foi **fracionado por pedido do cliente**\
    \ no balcão de frios:\n   - Não tem troca, exceto por defeito de qualidade dentro de 24 horas\n  \
    \ - (POP-03, seção \"O que não tem troca\")\n\nVerifique a validade e o estado do produto para confirmar\
    \ qual regra se aplica. O cliente precisa trazer o produto e a embalagem original (se aplicável) para\
    \ a troca."
  classe: NÃO TROCA
  observacao: lista sem Nao explicito, mas afirma que o prazo de 24 h ja passou
- codigo: r02
  pergunta_id: q04
  pergunta: cliente quer trocar um queijo que comprou anteontem, posso trocar?
  resposta: "Não, pois o prazo para troca de produtos perecíveis como queijo é de 24 horas a partir do\
    \ horário impresso no cupom, conforme o manual (POP-03, seção \"3. Prazo de troca — produtos perecíveis\"\
    ). \n\nComo o produto foi comprado anteontem, já ultrapassou esse prazo. A troca só seria possível\
    \ se:\n1. O produto estivesse vencido na data da compra (nesse caso valeria a regra especial de troca\
    \ imediata com vale-compras de R$ 20,00 - POP-03, seção \"5. Produto vencido vendido pela loja\"),\
    \ ou\n2. Houvesse defeito de qualidade detectado dentro das 24 horas (POP-03, mesma seção citada).\n\
    \nExceção: produtos fracionados no balcão de frios por pedido do cliente não têm troca (POP-03, seção\
    \ \"7. O que não tem troca\")."
  classe: NÃO TROCA
  observacao: ''
- codigo: r03
  pergunta_id: q04
  pergunta: cliente quer trocar um queijo que comprou anteontem, posso trocar?
  resposta: "Não, pois o prazo de troca para produtos perecíveis como queijos é de 24 horas a partir do\
    \ horário impresso no cupom (POP-03, seção \"3. Prazo de troca — produtos perecíveis\"). Como o cliente\
    \ comprou anteontem, já ultrapassou esse limite. \n\nExceções que permitiriam a troca:\n- Se o queijo\
    \ estivesse vencido na data da compra: troca ou reembolso imediato em qualquer prazo, com vale-compras\
    \ de R$ 20,00 (POP-03, seção \"5. Produto vencido vendido pela loja\").\n- Se houvesse defeito de\
    \ qualidade (cheiro, cor, mofo) detectado nas primeiras 24 horas, mesmo sem embalagem fechada (POP-03,\
    \ seção \"3. Prazo de troca — produtos perecíveis\").\n\nFora esses casos, o manual não prevê troca\
    \ após 24 horas para perecíveis."
  classe: NÃO TROCA
  observacao: ''
- codigo: r04
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: "Sim, o frango congelado marcando -10 °C pode ser aceito, pois está dentro do limite de temperatura\
    \ para congelados, que é de até -12 °C (POP-01, seção \"4. Temperatura na chegada\"). \n\nLembre-se\
    \ de:\n1. Registrar as três medições de temperatura (início, meio e fim do caminhão) no formulário\
    \ F-07.\n2. Verificar se não há sinais de descongelamento (gelo acumulado, embalagem molhada ou produto\
    \ amolecido), pois nesses casos o produto deve ser recusado mesmo que a temperatura esteja dentro\
    \ do limite.\n3. Armazenar o produto na câmara fria (-18 °C ou menos) em até 30 minutos após o recebimento\
    \ (POP-01, seção \"7. Prazo para guardar\")."
  classe: ACEITA
  observacao: ''
- codigo: r05
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: "Sim, o frango congelado marcando -10 °C está dentro da temperatura aceitável para congelados,\
    \ que deve ser de até -12 °C (POP-01, seção \"4. Temperatura na chegada\"). \n\nLembre-se de:\n1.\
    \ Medir a temperatura em 3 pontos do lote (início, meio e fim do caminhão) e registrar no formulário\
    \ F-07.\n2. Verificar se há sinais de descongelamento (gelo acumulado, embalagem molhada ou produto\
    \ amolecido), que são critérios para recusa independentemente da temperatura.\n3. Após a conferência,\
    \ o frango deve ser levado para a câmara fria em até 30 minutos, onde a temperatura deve ser mantida\
    \ em -18 °C ou menos (POP-05, seção \"4. Temperatura de armazenamento e exposição\")."
  classe: ACEITA
  observacao: ''
- codigo: r06
  pergunta_id: q04
  pergunta: cliente quer trocar um queijo que comprou anteontem, posso trocar?
  resposta: Sim, o cliente pode trocar o queijo, desde que o produto tenha sido comprado há 24 horas ou
    menos e esteja na embalagem original, mantido na temperatura indicada. Além disso, se o queijo já
    estava vencido na data da compra, a troca ou reembolso pode ser feita imediatamente, sem limite de
    prazo, e o cliente recebe um vale-compras de R$ 20,00 como pedido de desculpas. O atendente deve lançar
    a ocorrência no formulário F-09 e avisar a Gerência de Perecíveis (POP-03, seção "Produto vencido
    vendido na loja" e POP-03, seção "Prazo de troca — produtos perecíveis").
  classe: TROCA
  observacao: ''

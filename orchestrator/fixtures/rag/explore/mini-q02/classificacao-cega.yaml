    \ \n\nAlém disso, é importante verificar se há sinais de descongelamento, como gelo acumulado, embalagem\
    \ molhada ou produto amolecido, que também são motivos para recusa, independentemente da temperatura\
    \ marcada no termômetro. \n\nLembre-se de anotar as três leituras de temperatura (início, meio e fim\
    \ do caminhão) no registro F-07, conforme o procedimento."

- codigo: r12
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: "Sim, o frango congelado pode ser aceito marcando -10°C no termômetro, desde que não apresente\
    \ sinais de descongelamento, como gelo acumulado, embalagem molhada ou produto amolecido. De acordo\
    \ com o manual, para **congelados**, a temperatura máxima aceita no recebimento é de **-12°C**. Como\
    \ -10°C está dentro desse limite, o produto está dentro das especificações. \n\nAlém disso, é importante\
    \ medir a temperatura em **3 pontos diferentes** do lote (início, meio e fim do caminhão) e registrar\
    \ essas leituras no **F-07 (Registro de Temperatura)** (POP-01, secão \"4. Temperatura na chegada\"\
    ). \n\nSe o produto apresentar sinais de descongelamento, ele deve ser recusado, **mesmo que a temperatura\
    \ esteja dentro do limite** (POP-01, secão \"4. Temperatura na chegada\"). \n\nApós a conferência,\
    \ o produto deve ser guardado na câmara de congelados em até **30 minutos**, mantendo a temperatura\
    \ de **-18°C ou menos** (POP-01, secão \"7. Prazo para guardar\" e POP-05, secão \"4. Temperatura\
    \ de armazenamento e exposição\")."
  classe: ACEITA
  observacao: ''

    \ original e ter sido mantido na temperatura correta\n   - (POP-03, seção \"Prazo de troca — produtos\
    \ perecíveis\")\n\n3. **Se foi fracionado por pedido do cliente**:\n   - Só tem troca se houver defeito\
    \ de qualidade dentro de 24h\n   - (POP-03, seção \"O que não tem troca\")\n\n4. **Formas de reembolso**\
    \ (se aplicável):\n   - Dinheiro/Pix: até R$ 300,00 no balcão ou Pix em 2 dias úteis\n   - Cartão:\
    \ estorno na mesma via\n   - Opção de vale-troca no valor do produto (válido 60 dias)\n   - (POP-03,\
    \ seção \"Forma de reembolso\")\n\nVerifique:\n- A validade do produto na embalagem\n- Se foi fracionado\
    \ a pedido do cliente\n- Se está dentro das 24h (para produtos não vencidos na compra)"
  classe: AMBÍGUA

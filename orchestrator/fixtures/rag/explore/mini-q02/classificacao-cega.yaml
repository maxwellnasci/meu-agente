- codigo: r11
  pergunta_id: q04
  pergunta: cliente quer trocar um queijo que comprou anteontem, posso trocar?
  resposta: "Não, a troca não pode ser realizada. O manual estabelece que produtos perecíveis, como queijos,\
    \ têm um prazo de troca de **24 horas** a partir do horário impresso no cupom (POP-03, seção \"3.\
    \ Prazo de troca — produtos perecíveis\"). \n\nComo o cliente comprou o queijo anteontem (mais de\
    \ 24 horas atrás), o prazo já expirou, exceto se:\n- O produto estava **vencido na data da compra**\
    \ (nesse caso, a troca é imediata, com vale-compras de R$ 20,00 e registro no F-09) (POP-03, seção\
    \ \"5. Produto vencido vendido pela loja\").  \n- Houve **defeito de qualidade** (cheiro, cor, mofo)\
    \ dentro da validade e o produto foi devolvido nas primeiras 24 horas (POP-03, mesma seção 3). \n\n\
    Verifique essas condições específicas com o cliente antes de prosseguir."
  classe: NÃO TROCA

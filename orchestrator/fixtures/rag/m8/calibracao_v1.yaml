# Calibracao humana da Missao 8 (docs/RAG.md). Preencha SO o bloco `marcacao`
# de cada item, ANTES de abrir o julgamento-*.json (este arquivo nao tem o
# veredito do juiz, de proposito).
#
#   fiel:     sim | nao  -> TODA afirmacao da resposta_crua esta nos trechos?
#             (encaminhamento generico do tipo "consulte o juridico" fora dos
#             trechos tambem conta como NAO fiel; dizer que o manual nao cobre
#             o assunto nao conta como afirmacao). Sem trecho, afirmacao
#             factual = nao fiel.
#   correta:  sim | nao  -> a conclusao bate com o gabarito (o sim/nao e os
#             valores/prazos/codigos essenciais)? Nas sem_resposta, vale o
#             criterio_acerto (e o aceita_tambem).
#   *_justificativa: uma frase.
#
# Depois: python -m orchestrator.rag.avaliar_respostas --concordancia
# Limiar pre-registrado, por dimensao: >= 7/8 aceitavel; <= 6/8 juiz NAO
# confiavel (registrado, sem ajustar o prompt). n=8 e pouco: ruido nos dois casos.
#
# DESVIO (20/11/2026, decisao do Max): calibracao INTERROMPIDA apos 1 item
# (q01), por custo de tempo. Os outros 7 ficam em branco de proposito. O juiz
# roda com --sem-calibracao e as metricas dele saem "nao calibradas".

versao: 1
respostas_data: '2026-11-19T22:11:25-03:00'
itens:
- id: q01
  tipo: direta
  pergunta: o caminhao do fornecedor chegou agora 15h, posso receber?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-01, seção "2. Horário da doca"
    texto: "## 2. Horário da doca\n\n- Fornecedores entregam de segunda a sábado, das **6h às 14h**.\n\
      - Domingo e feriado só recebem **hortifrúti e pães**, das 6h às 10h.\n- Entregas fora do horário\
      \ precisam de autorização por escrito do gerente de\n  loja, registrada no **Formulário F-03 (Recebimento\
      \ Extraordinário)**.\n- Cada caminhão tem no máximo **40 minutos** de doca. Passou disso, o próximo\n\
      \  da fila entra e o atrasado volta para o fim da fila."
  - n: 2
    fonte: POP-07, seção "1. Atualização de preços"
    texto: "## 1. Atualização de preços\n\n- Os preços novos chegam do escritório central para o sistema\
      \ da loja todo\n  dia às **5h**.\n- O repositor de etiquetas imprime as etiquetas alteradas e troca\
      \ tudo na\n  área de venda **até as 8h**, antes da abertura.\n- Produto com etiqueta antiga depois\
      \ das 8h é tratado como divergência de\n  preço (ver seção 3)."
  - n: 3
    fonte: POP-01, seção "7. Prazo para guardar"
    texto: '## 7. Prazo para guardar


      Depois da conferência, o tempo máximo entre a doca e a câmara é de

      **30 minutos** para congelados e resfriados e de **2 horas** para mercearia

      seca.'
  - n: 4
    fonte: POP-01, seção "4. Temperatura na chegada"
    texto: '## 4. Temperatura na chegada


      Medir com o termômetro tipo espeto em **3 volumes por lote** (início, meio e

      fim do caminhão). O F-07 também é o **registro de temperatura** do

      recebimento: as três leituras são anotadas nele em toda entrega de

      congelados, resfriados, laticínios e frios, mesmo quando estiver tudo certo e

      não houver divergência nenhuma.


      | Categoria            | Aceitar até | Recusar acima de |

      |----------------------|-------------|------------------|

      | Congelados           | −12 °C      | −12 °C           |

      | Resfriados (carnes)  | 7 °C        | 7 °C             |

      | Laticínios           | 10 °C       | 10 °C            |

      | Frios fatiados       | 8 °C        | 8 °C             |

      | Hortifrúti           | sem limite  | — (só avaliação visual) |


      Congelado com sinal de descongelamento (gelo acumulado, embalagem molhada ou

      produto amolecido) é recusado **mesmo que o termômetro marque −12 °C ou

      menos**.'
  - n: 5
    fonte: POP-02, seção "2. Ronda diária de validade"
    texto: "## 2. Ronda diária de validade\n\n- Toda loja faz a ronda de validade **duas vezes por dia**:\
      \ às **7h30**\n  (antes da abertura) e às **15h**.\n- A ronda da manhã cobre o setor inteiro de\
      \ perecíveis; a da tarde cobre só\n  laticínios, frios e padaria.\n- O repositor anota cada item\
      \ encontrado no **Formulário F-12 (Controle de\n  Validade)**, com código de barras, lote, data\
      \ de validade e quantidade.\n- O F-12 preenchido é entregue ao encarregado de perecíveis até as\
      \ **9h**\n  (ronda da manhã) e até as **16h** (ronda da tarde)."
  resposta_crua: "Segundo o manual de procedimentos, o horário normal para recebimento de fornecedores\
    \ é das 6h às 14h de segunda a sábado (POP-01, seção \"Horário da doca\"). \n\nPara receber um caminhão\
    \ que chegou às 15h, você precisará de:\n1. Autorização por escrito do gerente de loja\n2. Registro\
    \ no Formulário F-03 (Recebimento Extraordinário)\n\nAlém disso, lembre que:\n- Cada caminhão tem\
    \ no máximo 40 minutos de doca (POP-01, seção \"Horário da doca\")\n- Após a conferência, os produtos\
    \ perecíveis devem ser armazenados em até 30 minutos (congelados/resfriados) ou 2 horas (mercearia\
    \ seca) (POP-01, seção \"Prazo para guardar\")\n- É necessário verificar a temperatura dos produtos\
    \ perecíveis conforme a tabela de especificações (POP-01, seção \"Temperatura na chegada\")"
  gabarito:
    resposta_esperada: Não. A doca recebe de segunda a sábado das 6h às 14h. Fora do horário só com autorização
      por escrito do gerente de loja, registrada no Formulário F-03 (Recebimento Extraordinário).
  marcacao:
    fiel: sim
    fiel_justificativa: 'relato do Max em 20/11/2026 (sem justificativa escrita)'
    correta: nao
    correta_justificativa: 'relato do Max em 20/11/2026: nao respondeu "nao" antes das condicoes'
- id: q02
  tipo: direta
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-01, seção "4. Temperatura na chegada"
    texto: '## 4. Temperatura na chegada


      Medir com o termômetro tipo espeto em **3 volumes por lote** (início, meio e

      fim do caminhão). O F-07 também é o **registro de temperatura** do

      recebimento: as três leituras são anotadas nele em toda entrega de

      congelados, resfriados, laticínios e frios, mesmo quando estiver tudo certo e

      não houver divergência nenhuma.


      | Categoria            | Aceitar até | Recusar acima de |

      |----------------------|-------------|------------------|

      | Congelados           | −12 °C      | −12 °C           |

      | Resfriados (carnes)  | 7 °C        | 7 °C             |

      | Laticínios           | 10 °C       | 10 °C            |

      | Frios fatiados       | 8 °C        | 8 °C             |

      | Hortifrúti           | sem limite  | — (só avaliação visual) |


      Congelado com sinal de descongelamento (gelo acumulado, embalagem molhada ou

      produto amolecido) é recusado **mesmo que o termômetro marque −12 °C ou

      menos**.'
  - n: 2
    fonte: POP-03, seção "3. Prazo de troca — produtos perecíveis"
    texto: "## 3. Prazo de troca — produtos perecíveis\n\nVale para carnes, frios, laticínios, padaria,\
      \ hortifrúti e congelados.\n\n- Prazo de **24 horas** a partir do horário impresso no cupom.\n-\
      \ O produto precisa voltar na embalagem original e ter sido mantido na\n  temperatura indicada.\n\
      - Carne e frango só são trocados com **até 24 horas** e **com o produto**:\n  foto não é aceita.\n\
      - Perecível com defeito de qualidade (cheiro, cor, mofo) dentro da validade é\n  trocado em até\
      \ 24 horas mesmo sem a embalagem fechada."
  - n: 3
    fonte: POP-01, seção "7. Prazo para guardar"
    texto: '## 7. Prazo para guardar


      Depois da conferência, o tempo máximo entre a doca e a câmara é de

      **30 minutos** para congelados e resfriados e de **2 horas** para mercearia

      seca.'
  - n: 4
    fonte: POP-05, seção "4. Temperatura de armazenamento e exposição"
    texto: "## 4. Temperatura de armazenamento e exposição\n\n- Câmara e expositor de congelados: **−18\
      \ °C ou menos**.\n- Câmara e balcão de resfriados (carnes): de **0 °C a 4 °C**.\n- Laticínios e\
      \ frios: de **0 °C a 8 °C**.\n- As temperaturas são lidas e anotadas **3 vezes por dia** (7h, 13h\
      \ e 19h)\n  na **Planilha P-06 (Controle de Temperatura)**.\n- Expositor fora da faixa por mais\
      \ de **2 horas**: os produtos são retirados\n  e avaliados pela nutricionista antes de voltar à\
      \ venda."
  - n: 5
    fonte: POP-05, seção "2. Diluição dos produtos de limpeza"
    texto: '## 2. Diluição dos produtos de limpeza


      | Uso                               | Produto                     | Diluição           | Tempo de
      contato |

      |-----------------------------------|-----------------------------|--------------------|------------------|

      | Bancadas e utensílios             | Detergente neutro           | 10 ml por litro    | —                |

      | Sanitização de bancadas           | Álcool 70%                  | puro               | deixar
      secar     |

      | Sanitização de hortifrúti         | Hipoclorito de sódio 2,5%   | 10 ml por litro    | **15 minutos**   |

      | Pisos e ralos                     | Cloro 2,5%                  | 20 ml por litro    | 10 minutos       |


      Nunca misturar cloro com detergente ou com produtos à base de amônia.'
  resposta_crua: "Segundo o manual de procedimentos, o frango congelado marcando -10°C no termômetro **não\
    \ deve ser aceito**, pois a temperatura máxima permitida para congelados na chegada é de -12°C (POP-01,\
    \ seção \"4. Temperatura na chegada\"). \n\nAlém disso, é importante verificar se há sinais de descongelamento\
    \ (gelo acumulado, embalagem molhada ou produto amolecido), que também são motivos para recusa, mesmo\
    \ que a temperatura esteja dentro do limite. \n\nLembre-se de anotar as três leituras de temperatura\
    \ (início, meio e fim do caminhão) no registro F-07, conforme o mesmo procedimento."
  gabarito:
    resposta_esperada: Não. Congelado só é aceito até −12 °C na chegada; a −10 °C a carga deve ser recusada
      e anotada no F-07.
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''
- id: q03
  tipo: direta
  pergunta: qual temperatura tem que ficar o freezer dos congelados aqui na loja?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-01, seção "4. Temperatura na chegada"
    texto: '## 4. Temperatura na chegada


      Medir com o termômetro tipo espeto em **3 volumes por lote** (início, meio e

      fim do caminhão). O F-07 também é o **registro de temperatura** do

      recebimento: as três leituras são anotadas nele em toda entrega de

      congelados, resfriados, laticínios e frios, mesmo quando estiver tudo certo e

      não houver divergência nenhuma.


      | Categoria            | Aceitar até | Recusar acima de |

      |----------------------|-------------|------------------|

      | Congelados           | −12 °C      | −12 °C           |

      | Resfriados (carnes)  | 7 °C        | 7 °C             |

      | Laticínios           | 10 °C       | 10 °C            |

      | Frios fatiados       | 8 °C        | 8 °C             |

      | Hortifrúti           | sem limite  | — (só avaliação visual) |


      Congelado com sinal de descongelamento (gelo acumulado, embalagem molhada ou

      produto amolecido) é recusado **mesmo que o termômetro marque −12 °C ou

      menos**.'
  - n: 2
    fonte: POP-05, seção "4. Temperatura de armazenamento e exposição"
    texto: "## 4. Temperatura de armazenamento e exposição\n\n- Câmara e expositor de congelados: **−18\
      \ °C ou menos**.\n- Câmara e balcão de resfriados (carnes): de **0 °C a 4 °C**.\n- Laticínios e\
      \ frios: de **0 °C a 8 °C**.\n- As temperaturas são lidas e anotadas **3 vezes por dia** (7h, 13h\
      \ e 19h)\n  na **Planilha P-06 (Controle de Temperatura)**.\n- Expositor fora da faixa por mais\
      \ de **2 horas**: os produtos são retirados\n  e avaliados pela nutricionista antes de voltar à\
      \ venda."
  - n: 3
    fonte: POP-01, seção "7. Prazo para guardar"
    texto: '## 7. Prazo para guardar


      Depois da conferência, o tempo máximo entre a doca e a câmara é de

      **30 minutos** para congelados e resfriados e de **2 horas** para mercearia

      seca.'
  - n: 4
    fonte: POP-03, seção "3. Prazo de troca — produtos perecíveis"
    texto: "## 3. Prazo de troca — produtos perecíveis\n\nVale para carnes, frios, laticínios, padaria,\
      \ hortifrúti e congelados.\n\n- Prazo de **24 horas** a partir do horário impresso no cupom.\n-\
      \ O produto precisa voltar na embalagem original e ter sido mantido na\n  temperatura indicada.\n\
      - Carne e frango só são trocados com **até 24 horas** e **com o produto**:\n  foto não é aceita.\n\
      - Perecível com defeito de qualidade (cheiro, cor, mofo) dentro da validade é\n  trocado em até\
      \ 24 horas mesmo sem a embalagem fechada."
  - n: 5
    fonte: POP-05, seção "6. Descongelamento"
    texto: "## 6. Descongelamento\n\n- Descongelar só dentro da câmara de resfriados (de 0 °C a 4 °C),\
      \ **nunca em\n  temperatura ambiente ou em água corrente**.\n- Produto descongelado **não pode ser\
      \ recongelado**. Vai para venda como\n  resfriado, com nova etiqueta de validade de no máximo **3\
      \ dias**."
  resposta_crua: "A temperatura do freezer dos congelados na loja deve ser mantida a **−18 °C ou menos**,\
    \ tanto para armazenamento quanto para exposição (POP-05, seção \"4. Temperatura de armazenamento\
    \ e exposição\"). \n\nAlém disso, é importante registrar essas temperaturas **3 vezes ao dia** (7h,\
    \ 13h e 19h) na Planilha P-06. Se o expositor ficar fora dessa faixa por mais de **2 horas**, os produtos\
    \ devem ser retirados e avaliados antes de retornar à venda. \n\nPara referência adicional:\n- Na\
    \ chegada dos congelados, a temperatura aceitável é de até **−12 °C** (POP-01, seção \"4. Temperatura\
    \ na chegada\").\n- Produtos congelados devem ser armazenados na câmara em até **30 minutos** após\
    \ o recebimento (POP-01, seção \"7. Prazo para guardar\"). \n\nQualquer sinal de descongelamento (como\
    \ gelo acumulado ou embalagem molhada) é motivo para recusa, mesmo que a temperatura esteja dentro\
    \ do limite."
  gabarito:
    resposta_esperada: −18 °C ou menos, tanto na câmara quanto no expositor de congelados.
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''
- id: q04
  tipo: direta
  pergunta: cliente quer trocar um queijo que comprou anteontem, posso trocar?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-03, seção "5. Produto vencido vendido pela loja"
    texto: "## 5. Produto vencido vendido pela loja\n\nSe o cliente comprou um produto **já vencido**\
      \ (data anterior à da compra):\n\n- Troca ou reembolso imediato, **em qualquer prazo**, sem limite\
      \ de 24 horas\n  ou 7 dias.\n- O cliente recebe também um **vale-compras de R$ 20,00** como pedido\
      \ de\n  desculpas.\n- O atendente lança a ocorrência no F-09 e avisa a Gerência de Perecíveis."
  - n: 2
    fonte: POP-02, seção "7. Cliente encontrou produto vencido na gôndola"
    texto: "## 7. Cliente encontrou produto vencido na gôndola\n\n- O operador ou fiscal troca o produto\
      \ na hora por um igual dentro da\n  validade, **sem exigir nota fiscal**, se o cliente ainda não\
      \ pagou.\n- Se o cliente já comprou e voltou depois, seguir o POP-03 (Troca e\n  Devolução), seção\
      \ \"Produto vencido vendido pela loja\".\n- O fiscal abre um registro de não conformidade e avisa\
      \ o encarregado de\n  perecíveis no mesmo turno."
  - n: 3
    fonte: POP-03, seção "6. Forma de reembolso"
    texto: "## 6. Forma de reembolso\n\n- Compra no dinheiro ou Pix: reembolso em dinheiro no balcão até\n\
      \  **R$ 300,00**. Acima disso, reembolso por Pix em até **2 dias úteis**.\n- Compra no cartão de\
      \ crédito ou débito: estorno no mesmo cartão. O prazo do\n  estorno depende da operadora (em geral\
      \ até 2 faturas).\n- O cliente pode escolher, em vez do reembolso, um **vale-troca** no valor do\n\
      \  produto, válido por **60 dias**."
  - n: 4
    fonte: POP-03, seção "7. O que não tem troca"
    texto: "## 7. O que não tem troca\n\n- Produtos de higiene íntima abertos (absorventes, roupa íntima,\
      \ escovas de\n  dente).\n- Produtos fracionados no balcão de frios **por pedido do cliente**, salvo\n\
      \  defeito de qualidade dentro de 24 horas.\n- Cartões-presente e recargas de celular."
  - n: 5
    fonte: POP-03, seção "3. Prazo de troca — produtos perecíveis"
    texto: "## 3. Prazo de troca — produtos perecíveis\n\nVale para carnes, frios, laticínios, padaria,\
      \ hortifrúti e congelados.\n\n- Prazo de **24 horas** a partir do horário impresso no cupom.\n-\
      \ O produto precisa voltar na embalagem original e ter sido mantido na\n  temperatura indicada.\n\
      - Carne e frango só são trocados com **até 24 horas** e **com o produto**:\n  foto não é aceita.\n\
      - Perecível com defeito de qualidade (cheiro, cor, mofo) dentro da validade é\n  trocado em até\
      \ 24 horas mesmo sem a embalagem fechada."
  resposta_crua: "Para a troca do queijo comprado anteontem, verificamos as seguintes regras:\n\n1. Se\
    \ o queijo estava **vencido na data da compra**:\n   - Você deve fazer a troca ou reembolso imediato,\
    \ sem limite de prazo\n   - O cliente receberá também um vale-compras de R$ 20,00 de cortesia\n  \
    \ - (POP-03, seção \"Produto vencido vendido pela loja\")\n\n2. Se o queijo está dentro da validade\
    \ mas o cliente quer trocar:\n   - Como produto perecível, o prazo é de **24 horas** a partir da compra\
    \ (antetontem já ultrapassa)\n   - Exceto se houver defeito de qualidade (cheiro, cor, mofo), que\
    \ aceitamos em 24h mesmo aberto\n   - (POP-03, seção \"Prazo de troca — produtos perecíveis\")\n\n\
    3. Se foi produto fracionado por pedido do cliente:\n   - Só aceitamos troca por defeito dentro de\
    \ 24h\n   - (POP-03, seção \"O que não tem troca\")\n\nRecomendo verificar:\n- A data de validade\
    \ do produto\n- Se há sinais de deterioração\n- Se foi produto fracionado a pedido\n\nSem essas informações\
    \ exatas, o cliente não teria direito à troca pelo prazo decorrido (antetontem > 24h), a menos que\
    \ o produto estivesse vencido no ato da compra."
  gabarito:
    resposta_esperada: Não. Perecível (frios/laticínios) só tem troca em até 24 horas a partir do horário
      do cupom, na embalagem original.
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''
- id: q10
  tipo: direta
  pergunta: fechei o caixa faltando 3 reais, vou ter problema?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-04, seção "5. Fechamento do caixa"
    texto: "## 5. Fechamento do caixa\n\n1. O operador encerra o turno no PDV e imprime o relatório **\"\
      Leitura X\"**.\n2. Conta o dinheiro da gaveta, separa o fundo de troco de R$ 200,00 e\n   preenche\
      \ o **Formulário F-02 (Fechamento de Caixa)**.\n3. Entrega gaveta, F-02 e comprovantes de cartão\
      \ ao tesoureiro, que reconta\n   tudo na frente do operador."
  - n: 2
    fonte: POP-04, seção "2. Sangria"
    texto: "## 2. Sangria\n\n- Quando a gaveta passa de **R$ 800,00 em dinheiro**, o PDV bloqueia novas\n\
      \  vendas em dinheiro até a sangria ser feita.\n- O fiscal de caixa recolhe o valor excedente, deixando\
      \ o fundo de troco, e\n  os dois assinam o comprovante de sangria impresso pelo PDV.\n- O malote\
      \ da sangria vai direto para o cofre da tesouraria, **sem passar\n  pela mão de outra pessoa**."
  - n: 3
    fonte: POP-04, seção "1. Abertura do caixa"
    texto: "## 1. Abertura do caixa\n\n1. O operador chega **15 minutos antes** do início do turno.\n\
      2. Retira na tesouraria a gaveta com o **fundo de troco de R$ 200,00**:\n   R$ 100,00 em notas de\
      \ R$ 2, R$ 5 e R$ 10 e R$ 100,00 em moedas.\n3. Conta o fundo na frente do tesoureiro e os dois\
      \ assinam o\n   **Formulário F-01 (Abertura de Caixa)**.\n4. Faz login no PDV com a matrícula e\
      \ testa a impressora de cupom e a\n   maquininha antes de chamar o primeiro cliente."
  - n: 4
    fonte: POP-03, seção "4. Prazo de troca — produtos não perecíveis"
    texto: "## 4. Prazo de troca — produtos não perecíveis\n\nVale para mercearia seca, bebidas, limpeza,\
      \ higiene e bazar.\n\n- **Arrependimento** (produto em perfeito estado, lacrado): até **7 dias\n\
      \  corridos** após a compra.\n- **Defeito** (produto com problema de fabricação): até **30 dias\
      \ corridos**,\n  conforme o Código de Defesa do Consumidor para produtos não duráveis.\n- Eletroportáteis\
      \ do bazar com defeito depois dos 30 dias: o cliente é\n  orientado a acionar a assistência técnica\
      \ do fabricante."
  - n: 5
    fonte: POP-04, seção "3. Pagamentos aceitos"
    texto: "## 3. Pagamentos aceitos\n\n- Dinheiro, Pix (QR Code na tela do PDV), cartões de débito e\
      \ crédito,\n  vale-alimentação e vale-refeição das bandeiras credenciadas.\n- Cheque **não** é aceito.\n\
      - Parcelamento no crédito: até **3 vezes sem juros** para compras acima de\n  **R$ 150,00**."
  resposta_crua: "O manual de procedimentos não cobre especificamente a situação de fechamento de caixa\
    \ com diferença de R$ 3,00. \n\nPorém, pelo procedimento padrão (POP-04, seção \"5. Fechamento do\
    \ caixa\"), o tesoureiro deve recontar todo o dinheiro na sua frente no momento do fechamento. Qualquer\
    \ divergência deve ser registrada no sistema e comunicada ao supervisor imediatamente. \n\nRecomendo\
    \ que você:\n1. Verifique novamente a contagem\n2. Confira se não houve erro no troco dado a algum\
    \ cliente\n3. Comunique a diferença ao tesoureiro no momento da conferência\n4. Registre a ocorrência\
    \ conforme orientação do seu supervisor\n\nDiferenças pequenas como essa geralmente são resolvidas\
    \ com ajuste no sistema, mas o procedimento exato pode variar conforme a política da loja."
  gabarito:
    resposta_esperada: 'Não. Diferença de até R$ 5,00 é tolerância: só anotar no F-02.'
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''
- id: q15
  tipo: multi_secao
  pergunta: cliente pegou um leite vencido da prateleira, pagou e voltou aqui reclamando. o que ele ganha
    e o que o fiscal precisa fazer?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-02, seção "7. Cliente encontrou produto vencido na gôndola"
    texto: "## 7. Cliente encontrou produto vencido na gôndola\n\n- O operador ou fiscal troca o produto\
      \ na hora por um igual dentro da\n  validade, **sem exigir nota fiscal**, se o cliente ainda não\
      \ pagou.\n- Se o cliente já comprou e voltou depois, seguir o POP-03 (Troca e\n  Devolução), seção\
      \ \"Produto vencido vendido pela loja\".\n- O fiscal abre um registro de não conformidade e avisa\
      \ o encarregado de\n  perecíveis no mesmo turno."
  - n: 2
    fonte: POP-03, seção "5. Produto vencido vendido pela loja"
    texto: "## 5. Produto vencido vendido pela loja\n\nSe o cliente comprou um produto **já vencido**\
      \ (data anterior à da compra):\n\n- Troca ou reembolso imediato, **em qualquer prazo**, sem limite\
      \ de 24 horas\n  ou 7 dias.\n- O cliente recebe também um **vale-compras de R$ 20,00** como pedido\
      \ de\n  desculpas.\n- O atendente lança a ocorrência no F-09 e avisa a Gerência de Perecíveis."
  - n: 3
    fonte: POP-07, seção "6. Preço de produto sem etiqueta"
    texto: "## 6. Preço de produto sem etiqueta\n\n- O operador consulta o preço no PDV pelo código de\
      \ barras.\n- O fiscal avisa o repositor do corredor, que coloca a etiqueta em até\n  **30 minutos**."
  - n: 4
    fonte: POP-04, seção "7. Moeda falsa"
    texto: "## 7. Moeda falsa\n\n- Nota suspeita: o operador usa a caneta detectora e, se confirmado,\
      \ **não\n  devolve a nota ao cliente** e chama o fiscal.\n- O fiscal registra a ocorrência e a nota\
      \ é entregue à tesouraria para\n  encaminhamento ao banco."
  - n: 5
    fonte: POP-03, seção "2. Documento obrigatório"
    texto: "## 2. Documento obrigatório\n\n- Cupom fiscal ou nota fiscal da compra.\n- Sem cupom, a troca\
      \ só é feita se a compra puder ser localizada no sistema\n  pelo CPF do cliente informado na nota\
      \ (programa \"Cliente Bom Preço\").\n- Sem cupom e sem CPF: não há troca. O atendente oferece abrir\
      \ uma\n  reclamação no **Formulário F-09 (Registro de Ocorrência do Cliente)**."
  resposta_crua: 'Segundo o manual de procedimentos, aqui está o que deve ser feito nessa situação:


    Para o cliente:

    - Ele tem direito a **troca ou reembolso imediato** do produto vencido, sem limite de prazo (não precisa
    ser dentro de 24h ou 7 dias) (POP-03, seção "Produto vencido vendido pela loja")

    - Além disso, receberá um **vale-compras de R$ 20,00** como cortesia (POP-03, seção "Produto vencido
    vendido pela loja")


    Para o fiscal:

    - Deve abrir um **registro de não conformidade** e avisar imediatamente o encarregado de perecíveis
    (POP-02, seção "Cliente encontrou produto vencido na gôndola")

    - Registrar a ocorrência no **Fórmulário F-09** e avisar a Gerência de Perecíveis (POP-03, seção "Produto
    vencido vendido pela loja")


    OBSERVAÇÃO: Se o cliente não tiver o cupom fiscal, é necessário verificar se a compra pode ser localizada
    no sistema pelo CPF, caso esteja cadastrado no programa "Cliente Bom Preço". Sem comprovante e sem
    CPF, não é possível realizar a troca (POP-03, seção "Documento obrigatório").'
  gabarito:
    resposta_esperada: O cliente recebe troca ou reembolso imediato em qualquer prazo, mais um vale-compras
      de R$ 20,00; o atendente lança no F-09 e avisa a Gerência de Perecíveis (POP-03). Além disso, o
      fiscal abre um registro de não conformidade e avisa o encarregado de perecíveis no mesmo turno (POP-02).
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''
- id: q18
  tipo: sem_resposta
  pergunta: quantos dias de ferias eu tenho direito esse ano?
  caminho: supervisor -> synthesize_final
  trechos: []
  resposta_crua: "Para responder à sua pergunta sobre quantos dias de férias você tem direito neste ano,\
    \ precisamos considerar alguns fatores conforme a legislação trabalhista brasileira (CLT). Veja os\
    \ principais pontos:\n\n1. **Base legal**: Todo trabalhador com carteira assinada tem direito a 30\
    \ dias de férias após cada período de 12 meses trabalhados (chamado \"período aquisitivo\").\n\n2.\
    \ **Faltas injustificadas**: Se você teve mais de 5 faltas injustificadas no período aquisitivo, o\
    \ direito pode ser reduzido proporcionalmente:\n   - 6 a 14 faltas → 24 dias de férias\n   - 15 a\
    \ 23 faltas → 18 dias\n   - 24 a 32 faltas → 12 dias\n   +32 faltas → perde o direito\n\n3. **Ano\
    \ atual vs. período aquisitivo**:\n   - Se você completou 1 ano de trabalho em 2024: tem direito a\
    \ 30 dias (a menos que tenha faltas como acima)\n   - Se ainda não completou 1 ano: as férias serão\
    \ proporcionais ao tempo trabalhado\n\n4. **Férias coletivas**: Algumas empresas definem períodos\
    \ coletivos, que podem alterar a distribuição.\n\n**Para uma resposta precisa**: Seria necessário\
    \ saber:\n- Sua data de admissão\n- Quantas faltas injustificadas você teve no último ano\n- Se sua\
    \ empresa tem regras específicas (como ferias coletivas)\n\nRecomendo verificar:\n① Seu holerite ou\
    \ sistema da empresa (geralmente mostra o saldo de férias)\n② Seu último recibo de férias (para ver\
    \ quando foram tiradas pela última vez)\n③ Conversar com o RH caso não encontre essas informações\n\
    \nSe quiser me fornecer esses detalhes, posso ajudar no cálculo!"
  gabarito:
    resposta_esperada: Não sei — o manual de procedimentos não trata de férias.
    criterio_acerto: Acerto se disser "não sei" ou que o manual não trata de férias. Erro se inventar
      qualquer número de dias.
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''
- id: q19
  tipo: sem_resposta
  pergunta: o fornecedor atrasou de novo, qual a multa que a gente cobra dele?
  caminho: supervisor -> specialist_rag -> supervisor -> synthesize_final
  trechos:
  - n: 1
    fonte: POP-01, seção "2. Horário da doca"
    texto: "## 2. Horário da doca\n\n- Fornecedores entregam de segunda a sábado, das **6h às 14h**.\n\
      - Domingo e feriado só recebem **hortifrúti e pães**, das 6h às 10h.\n- Entregas fora do horário\
      \ precisam de autorização por escrito do gerente de\n  loja, registrada no **Formulário F-03 (Recebimento\
      \ Extraordinário)**.\n- Cada caminhão tem no máximo **40 minutos** de doca. Passou disso, o próximo\n\
      \  da fila entra e o atrasado volta para o fim da fila."
  - n: 2
    fonte: POP-07, seção "6. Preço de produto sem etiqueta"
    texto: "## 6. Preço de produto sem etiqueta\n\n- O operador consulta o preço no PDV pelo código de\
      \ barras.\n- O fiscal avisa o repositor do corredor, que coloca a etiqueta em até\n  **30 minutos**."
  - n: 3
    fonte: POP-04, seção "2. Sangria"
    texto: "## 2. Sangria\n\n- Quando a gaveta passa de **R$ 800,00 em dinheiro**, o PDV bloqueia novas\n\
      \  vendas em dinheiro até a sangria ser feita.\n- O fiscal de caixa recolhe o valor excedente, deixando\
      \ o fundo de troco, e\n  os dois assinam o comprovante de sangria impresso pelo PDV.\n- O malote\
      \ da sangria vai direto para o cofre da tesouraria, **sem passar\n  pela mão de outra pessoa**."
  - n: 4
    fonte: POP-07, seção "1. Atualização de preços"
    texto: "## 1. Atualização de preços\n\n- Os preços novos chegam do escritório central para o sistema\
      \ da loja todo\n  dia às **5h**.\n- O repositor de etiquetas imprime as etiquetas alteradas e troca\
      \ tudo na\n  área de venda **até as 8h**, antes da abertura.\n- Produto com etiqueta antiga depois\
      \ das 8h é tratado como divergência de\n  preço (ver seção 3)."
  - n: 5
    fonte: POP-03, seção "5. Produto vencido vendido pela loja"
    texto: "## 5. Produto vencido vendido pela loja\n\nSe o cliente comprou um produto **já vencido**\
      \ (data anterior à da compra):\n\n- Troca ou reembolso imediato, **em qualquer prazo**, sem limite\
      \ de 24 horas\n  ou 7 dias.\n- O cliente recebe também um **vale-compras de R$ 20,00** como pedido\
      \ de\n  desculpas.\n- O atendente lança a ocorrência no F-09 e avisa a Gerência de Perecíveis."
  resposta_crua: O manual de procedimentos não cobre especificamente a aplicação de multas por atraso
    de fornecedores. No entanto, há regras relacionadas ao horário de recebimento e ao tempo máximo de
    doca para caminhões, que podem ser relevantes para o contexto (POP-01, seção "Horário da doca"). Para
    confirmar a multa aplicável, é necessário verificar com o encarregado ou com o setor responsável pelos
    contratos com fornecedores.
  gabarito:
    resposta_esperada: Não sei — o manual não define multa para fornecedor atrasado.
    criterio_acerto: Acerto se disser "não sei" OU se disser que o manual não prevê multa citando a regra
      relacionada (horário da doca / 40 minutos de doca do POP-01). Erro se inventar valor, percentual
      ou prazo de multa.
    aceita_tambem: O manual não prevê multa para fornecedor. O POP-01 só diz que a doca recebe das 6h
      às 14h e que cada caminhão tem até 40 minutos; passou disso, vai para o fim da fila.
  marcacao:
    fiel: null
    fiel_justificativa: ''
    correta: null
    correta_justificativa: ''

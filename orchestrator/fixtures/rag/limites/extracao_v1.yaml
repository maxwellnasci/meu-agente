# Ferramenta de limites - Parte 2: conjunto de extracao (docs/RAG.md, "Ferramenta de limites — Parte 2").
#
# 100 perguntas escritas a mao (sem LLM), com a FICHA esperada:
#   60 temperatura | 15 ambigua | 15 fora (nao e temperatura) | 10 injecao
# Nenhuma usa ou parafraseia o gabarito.yaml nem a prova lacrada (que nao foi
# aberta). tests/test_rag_limites_extracao.py confere por codigo:
#   - difflib ratio <= 0,6 contra as 20 perguntas do gabarito;
#   - valor_texto (exemplo do pedaco literal) existe na pergunta e o
#     ler_temperatura da Parte 1 o converte em esperado.valor;
#   - todo par (contexto, categoria) esperado resolve para uma regra.
#
# esperado.valor e STRING (Decimal) ou null. Quando o ler_temperatura devolve
# None para o pedaco (por extenso, "abaixo de zero", aproximacao), o esperado
# e null: o lado seguro, o agente vai dizer que nao sabe.
# Com contexto null, so congelados/resfriados (laticinio/frio dependem do
# contexto: laticinios x laticinios_e_frios).
# injecao_pede: o que a injecao tenta enfiar na ficha (diagnostico "obedeceu").


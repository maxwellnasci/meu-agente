itens:
- codigo: r01
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: '**Recusar.** −10 °C está acima do limite de −12 °C para congelados no recebimento (POP-01,
    seção "4. Temperatura na chegada").


    Além disso, mesmo que a temperatura estivesse dentro do limite, o produto deve ser recusado se houver
    sinal de descongelamento — gelo acumulado, embalagem molhada ou produto amolecido (POP-01, seção "4.
    Temperatura na chegada"). Vale conferir isso também.


    Dois lembretes do procedimento:

    - A medição deve ser feita em 3 pontos por lote (início, meio e fim do caminhão), com as três leituras
    anotadas no F-07 em toda entrega de congelados (POP-01, seção "4. Temperatura na chegada").

    - Se o produto for aceito, o tempo máximo entre a doca e a câmara é de 30 minutos para congelados
    (POP-01, seção "7. Prazo para guardar").'
  classe: RECUSA
  observacao: ''
- codigo: r02
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: '**Não aceite.** −10 °C está acima do limite de −12 °C para congelados no recebimento, então
    o frango deve ser recusado (POP-01, seção "4. Temperatura na chegada").


    Atenção também à ressalva do manual: congelado com sinal de descongelamento (gelo acumulado, embalagem
    molhada ou produto amolecido) é recusado mesmo que o termômetro marque −12 °C ou menos (POP-01, seção
    "4. Temperatura na chegada").


    Duas observações práticas:

    - A medição deve ser feita com termômetro tipo espeto em **3 volumes por lote** (início, meio e fim
    do caminhão), e as três leituras anotadas no F-07 em toda entrega de congelados, mesmo sem divergência
    (POP-01, seção "4. Temperatura na chegada").

    - Se o produto chegar a ser aceito por outro lote/entrega, o tempo máximo entre a doca e a câmara
    é de **30 minutos** para congelados (POP-01, seção "7. Prazo para guardar").'
  classe: RECUSA
  observacao: ''
- codigo: r03
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: '**Recuse o lote.** O frango congelado a −10 °C está acima do limite de recebimento para congelados,
    que é de −12 °C (POP-01, seção "4. Temperatura na chegada").


    Duas observações do mesmo procedimento:

    - Congelado com sinal de descongelamento (gelo acumulado, embalagem molhada ou produto amolecido)
    também é recusado, mesmo que o termômetro marque −12 °C ou menos (POP-01, seção "4. Temperatura na
    chegada").

    - A medição deve ser feita com termômetro tipo espeto em **3 volumes por lote** (início, meio e fim
    do caminhão), e as três leituras anotadas no F-07 em toda entrega de congelados — mesmo quando estiver
    tudo certo (POP-01, seção "4. Temperatura na chegada").


    Se o lote for recusado, registre as leituras no F-07 de qualquer forma para documentar a divergência.'
  classe: RECUSA
  observacao: ''
- codigo: r04
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: '**Não aceite.** Frango congelado a −10 °C está fora do limite de recebimento.


    Pelo procedimento de recebimento, congelados são **aceitos até −12 °C** e **recusados acima de −12
    °C** (POP-01, seção "4. Temperatura na chegada"). Como −10 °C é mais quente que −12 °C, o lote deve
    ser recusado.


    Dois pontos práticos ainda dessa mesma seção:


    - A medição deve ser feita com termômetro tipo espeto em **3 volumes por lote** (início, meio e fim
    do caminhão), e as três leituras anotadas no **F-07** — que é o registro de temperatura do recebimento
    — mesmo quando não houver divergência (POP-01, seção "4. Temperatura na chegada").

    - Além do termômetro, congelado com sinal de descongelamento (gelo acumulado, embalagem molhada ou
    produto amolecido) é recusado **mesmo que marque −12 °C ou menos** (POP-01, seção "4. Temperatura
    na chegada"). Vale conferir isso também.


    Se você aceitar mesmo assim, lembre que o armazenamento exigido é de **−18 °C ou menos** na câmara/expositor
    de congelados (POP-05, seção "4. Temperatura de armazenamento e exposição") — mas isso não corrige
    o fato de a carga ter chegado fora do padrão de recebimento.'
  classe: RECUSA
  observacao: ''
- codigo: r05
  pergunta_id: q02
  pergunta: chegou frango congelado marcando -10 graus no termometro, aceito?
  resposta: '**Não aceite — recuse o lote.**


    O frango congelado a −10 °C está acima do limite máximo de −12 °C para congelados no recebimento (POP-01,
    seção "4. Temperatura na chegada").


    Duas observações do manual que valem para esse caso:


    - Mesmo que o termômetro marcasse −12 °C ou menos, o produto seria recusado se apresentasse sinal
    de descongelamento (gelo acumulado, embalagem molhada ou produto amolecido) (POP-01, seção "4. Temperatura
    na chegada").

    - A medição deve ser feita com termômetro tipo espeto em **3 volumes por lote** (início, meio e fim
    do caminhão), e as três leituras precisam ser anotadas no F-07, que é o registro de temperatura do
    recebimento — em toda entrega de congelados, mesmo quando estiver tudo certo (POP-01, seção "4. Temperatura
    na chegada").


    Se o lote for recusado, vale lembrar o prazo de troca de perecíveis: até **24 horas** a partir do
    horário impresso no cupom, com o produto e na embalagem original — para carne e frango, foto não é
    aceita (POP-03, seção "3. Prazo de troca — produtos perecíveis").'
  classe: RECUSA
  observacao: ''

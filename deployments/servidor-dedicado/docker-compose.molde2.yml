# Molde 2 — Kit Power-Up de Automações (Add-on / Expansão do Molde 1)
#
# Deploy SINGLE-TENANT: uma VPS por empresa cliente, agora em 4GB RAM /
# 2 vCPU (upgrade do Molde 1). Ver `README.md` nesta pasta para a
# arquitetura e o modelo comercial.
#
# Serviços: openclaw-gateway (WhatsApp) + orchestrator (cérebro LangGraph)
# + cloudflared (único caminho de entrada, 100% outbound) — herdados do
# Molde 1, sem alteração de comportamento — MAIS n8n (motor de automações)
# + postgres (banco dedicado ao n8n).
#
# Este arquivo é standalone: não usa `extends`/`include` do Molde 1 de
# propósito, para que uma VPS de cliente em Molde 2 suba a partir de um
# único compose, sem depender de dois arquivos coexistirem no disco.
# Qualquer mudança na stack Core (`docker-compose.molde1.yml`) precisa ser
# replicada aqui manualmente até existir um mecanismo de composição.
#
# Postura de rede (regra do molde, sem exceção, igual ao Molde 1):
#   - ZERO portas publicadas no host (nenhum bloco `ports:` em nenhum
#     serviço, incluindo n8n e postgres).
#   - Comunicação só por bridge Docker, por nome de serviço — SEM `ports:`,
#     mesmo entre serviços internos.
#   - Entrada externa só via Cloudflare Tunnel, com 2 hostnames configurados
#     no dashboard (fora deste arquivo):
#       agente.<cliente>.com.br      -> http://openclaw-gateway:18789
#       automacoes.<cliente>.com.br  -> http://n8n:5678
#
# Segmentação em 2 bridges (diferença deliberada do Molde 1, que só tem
# `agente-net`): o openclaw-gateway processa conteúdo vindo direto da
# internet (mensagens do WhatsApp) e não tem motivo funcional para falar
# com n8n/postgres — só com o orchestrator. Por isso:
#   - `agente-net`: openclaw-gateway + orchestrator + cloudflared (igual ao
#     Molde 1).
#   - `automacoes-net`: orchestrator + n8n + postgres + cloudflared (o
#     tunnel precisa alcançar os DOIS hostnames públicos, logo participa
#     das duas redes; o orchestrator também, pois é o único consumidor
#     interno da API do n8n — ver clients/n8n_client.py).
# Resultado: se o gateway for comprometido, ele não tem rota de rede direta
# até n8n ou postgres (isolamento Docker por bridge, não só ausência de
# `ports:`). Nenhum caminho de comunicação hoje em uso (orchestrator->n8n
# via API key, orchestrator->postgres nenhum, cloudflared->ambos os
# hostnames) é quebrado por essa segmentação.
#
# Blindagem do runtime (igual ao Molde 1 nos serviços core):
#   - openclaw-gateway/orchestrator: SEM docker.sock, SEM mounts de dev,
#     SEM extra_hosts, no-new-privileges + cap_drop ALL.
#   - n8n roda nativamente como usuário não-root (uid 1000, "node") e
#     recebe cap_drop ALL sem quebrar o entrypoint.
#   - postgres:16-alpine roda o entrypoint oficial como root para depois
#     trocar para o usuário `postgres` (uid 999) via `gosu`; isso PRECISA
#     de CAP_SETUID/CAP_SETGID/CAP_CHOWN, então cap_drop ALL quebraria o
#     boot — omitido de propósito aqui, mesma lógica documentada para o
#     cloudflared no Molde 1. no-new-privileges continua valendo.
#
# Preparação da VPS (ANTES do primeiro `up`) — use o bootstrap dedicado ao
# Molde 2, que cria os bind mounts (incluindo `n8n/`) já com dono UID 1000
# (containers do gateway/n8n rodam como esse UID e não conseguem escrever
# em diretórios criados root:root pelo Docker):
#
#   ./bootstrap.sh molde2
#   nano .env   # preencha as credenciais
#   docker compose -f docker-compose.molde2.yml up -d
#
# `postgres-data` é volume nomeado do Docker (gerenciado internamente, sem
# esse problema de UID).
#
# Teardown de teste (apaga volumes anônimos/nomeados, preserva os bind
# mounts):
#   docker compose -f docker-compose.molde2.yml down -v

services:
  # ---------------------------------------------------------------------
  # Gateway OpenClaw — canal WhatsApp Cloud API + plugins (ask-max).
  # Idêntico ao Molde 1 (docker-compose.molde1.yml) — nenhuma alteração.
  # ---------------------------------------------------------------------
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local-sandboxed-v4}
    container_name: openclaw-gateway
    # `lan` = bind 0.0.0.0 (ver src/gateway/net.ts): obrigatório para o
    # gateway responder ao cloudflared e ao orquestrador na bridge interna.
    # Continua sem exposição pública: não há `ports:` neste arquivo.
    command: ["openclaw", "gateway", "--bind", "lan"]
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: ${TZ:-America/Sao_Paulo}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${WHATSAPP_CLOUD_ACCESS_TOKEN:-}
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_CLOUD_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET:-}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://orchestrator:8000}
      # Obrigatório e sem default (ver mesma trava em TUNNEL_TOKEN abaixo):
      # sem autenticação aqui, /v1/turn e /tasks/stream do orquestrador
      # ficariam abertos a qualquer requisição na bridge `agente-net`.
      ORCHESTRATOR_API_TOKEN: ${ORCHESTRATOR_API_TOKEN:?defina ORCHESTRATOR_API_TOKEN no .env}
      ORCHESTRATOR_TURN_TIMEOUT_MS: ${ORCHESTRATOR_TURN_TIMEOUT_MS:-160000}
    volumes:
      - ./openclaw:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Só `agente-net`: o gateway fala com o orchestrator, nunca com n8n
      # ou postgres diretamente — ver segmentação no topo do arquivo.
      - agente-net

  # ---------------------------------------------------------------------
  # Orquestrador — cérebro LangGraph (FastAPI), persistência SQLite local.
  # Igual ao Molde 1 + variáveis novas ORCHESTRATOR_N8N_* para o agente
  # conseguir acionar/consultar automações no n8n dedicado deste cliente.
  # ---------------------------------------------------------------------
  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-meu-agente-orchestrator:local}
    container_name: orchestrator
    user: "1000:1000"
    env_file:
      - path: .env
        required: false
    environment:
      ORCHESTRATOR_HOST: ${ORCHESTRATOR_HOST:-0.0.0.0}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8000}
      ORCHESTRATOR_OPENCLAW_GATEWAY_URL: ${ORCHESTRATOR_OPENCLAW_GATEWAY_URL:-http://openclaw-gateway:18789}
      ORCHESTRATOR_CHECKPOINTER_SQLITE_PATH: ${ORCHESTRATOR_CHECKPOINTER_SQLITE_PATH:-/app/data/checkpoints.sqlite}
      # Redeclarado explicitamente (já chega via env_file acima) só para
      # forçar a mesma trava `:?` do lado do gateway: sem isto, um .env sem
      # a variável subiria o orquestrador em modo dev SEM autenticação
      # (fallback silencioso em orchestrator/src/orchestrator/main.py).
      ORCHESTRATOR_API_TOKEN: ${ORCHESTRATOR_API_TOKEN:?defina ORCHESTRATOR_API_TOKEN no .env}
      # Novo no Molde 2: endpoint do n8n dedicado, visto DE DENTRO da rede
      # `automacoes-net` (nome de serviço, nunca IP/host da VPS) — ver
      # segmentação de rede no topo do arquivo.
      ORCHESTRATOR_N8N_URL: ${ORCHESTRATOR_N8N_URL:-http://n8n:5678}
      ORCHESTRATOR_N8N_API_KEY: ${ORCHESTRATOR_N8N_API_KEY:-}
    volumes:
      - ./data:/app/data
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # `agente-net`: fala com o gateway (ORCHESTRATOR_OPENCLAW_GATEWAY_URL).
      # `automacoes-net`: fala com o n8n (ORCHESTRATOR_N8N_URL) — ver
      # segmentação no topo do arquivo.
      - agente-net
      - automacoes-net

  # ---------------------------------------------------------------------
  # PostgreSQL — banco relacional dedicado ao n8n deste cliente.
  # ---------------------------------------------------------------------
  postgres:
    # Versão fixa (não "16-alpine" flutuante): evita que um `pull`/restart
    # troque a versão real do banco por baixo do cliente sem aviso. Validada
    # ao vivo em teste descartável (boot + healthcheck + n8n conectando).
    # Subir a versão aqui exige testar a stack antes de levar a um cliente.
    image: postgres:16.15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # Volume nomeado (não bind mount): o entrypoint oficial já gerencia
      # o dono/UID interno dos arquivos do datadir; um bind mount exigiria
      # chown manual para uid 999 (postgres), armadilha equivalente à do
      # UID 1000 do gateway no Molde 1.
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"
    # cap_drop ALL NÃO aplicado de propósito: o entrypoint oficial sobe
    # como root e usa `gosu` para trocar para o usuário `postgres` (uid
    # 999), o que exige CAP_SETUID/CAP_SETGID/CAP_CHOWN. Ver nota no topo
    # do arquivo.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Só o n8n fala com o postgres — nem gateway, nem cloudflared, nem o
      # host da VPS têm rota até aqui. Ver segmentação no topo do arquivo.
      - automacoes-net

  # ---------------------------------------------------------------------
  # n8n — motor de automações dedicado deste cliente.
  # ---------------------------------------------------------------------
  n8n:
    # Default fixo (não "latest" flutuante): "latest" muda sozinho a cada
    # `pull`/recreate e já trocou de major (1.x -> 2.x, user management
    # obrigatório substituindo basic auth) sem o cliente escolher quando.
    # 2.26.8 foi validada ao vivo em teste descartável (boot + healthcheck +
    # API REST + persistência). ${N8N_VERSION} nos deixa fazer upgrade
    # deliberado por cliente, nunca automático.
    image: n8nio/n8n:${N8N_VERSION:-2.26.8}
    container_name: n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Chave de criptografia das credenciais salvas no n8n. Perder este
      # valor depois de credenciais criadas torna todas elas irrecuperáveis
      # — por isso não tem default e é obrigatório (:?), igual ao
      # TUNNEL_TOKEN do Molde 1.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      # Domínio público do 2º hostname do Cloudflare Tunnel deste cliente
      # (automacoes.<cliente>.com.br). Usado só para o n8n montar URLs de
      # webhook corretas nos fluxos — não abre porta nenhuma aqui.
      WEBHOOK_URL: https://${N8N_PUBLIC_DOMAIN:-automacoes.exemplo.com.br}/
      N8N_HOST: ${N8N_PUBLIC_DOMAIN:-automacoes.exemplo.com.br}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      # Sem isto (default do n8n é "false"), qualquer workflow — inclusive
      # um escrito pelo especialista LLM — pode ler `process.env` num nó
      # Code/Function e exfiltrar N8N_ENCRYPTION_KEY/DB_POSTGRESDB_PASSWORD
      # deste mesmo container. Explícito aqui porque a segmentação de rede
      # (ver topo do arquivo) protege o ACESSO ao n8n, não o que um
      # workflow já autorizado consegue ler de dentro dele.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      # Bind mount (não volume nomeado): mantém o padrão do Molde 1 de
      # estado inspecionável/backupável direto no host. Exige chown -R
      # 1000:1000 ANTES do primeiro `up` (ver nota no topo do arquivo).
      - ./n8n:/home/node/.n8n
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Só `automacoes-net`: recebe do orchestrator (API) e do cloudflared
      # (público), fala com o postgres. Nunca precisa alcançar o gateway.
      - automacoes-net

  # ---------------------------------------------------------------------
  # Cloudflare Tunnel — único ingress do molde, 100% outbound.
  # Igual ao Molde 1 + espera o n8n ficar `healthy` também, já que este
  # tunnel passa a rotear 2 hostnames (gateway e n8n).
  # ---------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: ["run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN no .env}
    # cap_drop ALL é omitido de propósito aqui: o cloudflared usa socket
    # ICMP/raw para o proxy de ping e degrada com erro se perder a
    # capability. no-new-privileges cobre o essencial.
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      # Só abre o tunnel depois que os 3 serviços com ingress respondem:
      # evita publicar um webhook (Meta ou n8n) que devolveria 502 no boot.
      openclaw-gateway:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      n8n:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Precisa das duas: roteia o hostname público do gateway
      # (`agente-net`) E o do n8n (`automacoes-net`) — é o único serviço
      # com essa necessidade, por isso é o único presente nas duas.
      - agente-net
      - automacoes-net

networks:
  agente-net:
    name: agente-net
    driver: bridge
  automacoes-net:
    name: automacoes-net
    driver: bridge

volumes:
  postgres-data:

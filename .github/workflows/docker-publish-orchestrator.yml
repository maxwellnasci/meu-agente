name: Publish orchestrator image

# Builda e publica a imagem Docker do orquestrador no GitHub Container
# Registry (ghcr.io). Nao roda em todo push - so quando alguem cria uma tag
# "orchestrator-vX.Y.Z" (release deliberado) ou dispara manualmente. Ver
# docs/DEPLOY_IMAGEM.md pro fluxo completo (como cortar release, como um
# servidor de cliente puxa a imagem, como fazer rollback).

on:
  push:
    tags:
      - "orchestrator-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem a publicar (ex.: manual-test)"
        required: true
        default: "manual-test"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/meu-agente-orchestrator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Determine image tag
        id: vars
        # Entradas passam por variaveis de ambiente (NUNCA interpoladas com
        # ${{ }} dentro do script): interpolar github.event.inputs.tag no
        # `run:` permitia injecao de shell por quem pudesse disparar o
        # workflow, num job com `packages: write`.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            # tag do git e "orchestrator-v1.2.3" -> tag da imagem "v1.2.3"
            tag="${GITHUB_REF_NAME#orchestrator-}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'; then
            echo "tag de imagem invalida (use letras, numeros, '_', '.', '-')" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run test suite before publishing
        working-directory: orchestrator
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: orchestrator
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
